<anvil-form container="ColumnPanel">
  <anvil-component type="ColumnPanel" name="cp_main">
    <anvil-component type="FlowPanel" name="fp_header" prop:align="left">
      <anvil-component type="Label" name="lbl_title" prop:role="h1" prop:text="Titan AI" prop:spacing='{"padding":["0",null,"0",null]}' prop:icon="fa:magic"></anvil-component>
      <anvil-component type="Link" name="lk_new_chat" prop:role="secondary-button" prop:text="New chat" prop:spacing='{"margin":["0",null,"0",null]}'></anvil-component>
    </anvil-component>
    <anvil-component type="Label" name="lbl_subtitle" prop:role="lede" prop:text="Read-only — decisions stay in the apps." prop:spacing='{"margin":["0",null,"0",null],"padding":["0",null,"0",null]}' container:grid_position="IIJBMV,LBRZNI" container:full_width_row="false"></anvil-component>
    <anvil-component type="FlowPanel" name="fp_chips" prop:spacing='{"margin":["0",null,"0",null]}'></anvil-component>
    <anvil-component type="RepeatingPanel" name="rp_messages" prop:item_template="Titan_AI.TitanAIMessageRow" prop:margin='["0",null,"10",null]'></anvil-component>
    <anvil-component type="Label" name="lbl_busy" prop:text="Titan AI is thinking…" prop:visible="false" prop:spacing='{"margin":["0",null,"4",null],"padding":["0",null,"0",null]}'></anvil-component>
    <anvil-component type="FlowPanel" name="fp_input" prop:spacing='{"margin":["0",null,null,null]}'>
      <anvil-component type="TextBox" name="txt_question" prop:placeholder="Ask Titan AI a question…" prop:margin='["0",null,"0",null]'></anvil-component>
      <anvil-component type="Button" name="btn_send" prop:text="Ask" prop:spacing='{"margin":["0",null,"0",null]}'></anvil-component>
    </anvil-component>
    <anvil-component type="Timer" name="tmr_poll" prop:interval="1"></anvil-component>
  </anvil-component>
</anvil-form>
