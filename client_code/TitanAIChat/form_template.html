<anvil-form container="ColumnPanel">
  <anvil-component type="ColumnPanel" name="cp_main">
    <anvil-component type="FlowPanel" name="fp_header" prop:align="left">
      <anvil-component type="Label" name="lbl_title" prop:role="h1" prop:text="Titan AI"></anvil-component>
      <anvil-component type="Link" name="lk_new_chat" prop:role="secondary-button" prop:text="New chat"></anvil-component>
    </anvil-component>
    <anvil-component type="Label" name="lbl_subtitle" prop:role="lede" prop:text="Ask about work orders, inventory, transfers &amp; schedule. Read-only — decisions stay in the apps." container:grid_position="IIJBMV,LBRZNI" container:full_width_row="false"></anvil-component>
    <anvil-component type="FlowPanel" name="fp_chips" prop:spacing="small"></anvil-component>
    <anvil-component type="RepeatingPanel" name="rp_messages" prop:item_template="Titan_AI.TitanAIMessageRow"></anvil-component>
    <anvil-component type="Label" name="lbl_busy" prop:text="Titan AI is thinking…" prop:visible="false"></anvil-component>
    <anvil-component type="FlowPanel" name="fp_input" prop:spacing="small">
      <anvil-component type="TextBox" name="txt_question" prop:placeholder="Ask Titan AI a question…"></anvil-component>
      <anvil-component type="Button" name="btn_send" prop:text="Ask"></anvil-component>
    </anvil-component>
    <anvil-component type="Timer" name="tmr_poll" prop:interval="1"></anvil-component>
  </anvil-component>
</anvil-form>
