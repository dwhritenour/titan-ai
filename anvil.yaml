allow_embedding: false
db_schema:
  users:
    client: none
    columns:
    - admin_ui: {order: 0}
      name: email
      type: string
    - admin_ui: {order: 1}
      name: enabled
      type: bool
    - admin_ui: {order: 2}
      name: signed_up
      type: datetime
    - admin_ui: {order: 3}
      name: password_hash
      type: string
    - admin_ui: {order: 4}
      name: confirmed_email
      type: bool
    - admin_ui: {order: 5}
      name: remembered_logins
      type: simpleObject
    - admin_ui: {order: 6}
      name: last_login
      type: datetime
    - admin_ui: {order: 7}
      name: n_password_failures
      type: number
    server: full
    title: Users
name: Titan AI
package_name: Titan_AI
runtime_options:
  client_version: '3'
  server_spec: {base: python310-minimal}
  version: 3
services:
- client_config: {enable_v2: true}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_signup: false, use_email: true, use_token: false}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/anvil/secrets.yml
startup: {module: TitanAIChat, type: form}
