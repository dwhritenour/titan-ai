allow_embedding: false
db_schema:
  users:
    client: none
    columns:
    - admin_ui: {order: 0}
      name: email
      type: string
    - admin_ui: {order: 1}
      name: enabled
      type: bool
    - admin_ui: {order: 2}
      name: signed_up
      type: datetime
    - admin_ui: {order: 3}
      name: password_hash
      type: string
    - admin_ui: {order: 4}
      name: confirmed_email
      type: bool
    - admin_ui: {order: 5}
      name: remembered_logins
      type: simpleObject
    - admin_ui: {order: 6}
      name: last_login
      type: datetime
    - admin_ui: {order: 7}
      name: n_password_failures
      type: number
    server: full
    title: Users
name: Titan AI
package_name: Titan_AI
